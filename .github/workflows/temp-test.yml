name: temp-test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.0
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet
        uses: actions/cache@0c45773b623bea8c8e7586c8b74285800d603e91 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Bookify.sln

      - name: Build
        run: dotnet build Bookify.sln --configuration Release --no-restore

      - name: Run Domain Unit Tests
        run: dotnet test test/Bookify.Domain.UnitTests/Bookify.Domain.UnitTests.csproj --configuration Release --no-build

      - name: Run Application Unit Tests
        run: dotnet test test/Bookify.Application.UnitTests/Bookify.Application.UnitTests.csproj --configuration Release --no-build

      - name: Run Api Unit Tests
        run: dotnet test test/Bookify.Api.UnitTests/Bookify.Api.UnitTests.csproj --configuration Release --no-build

      - name: Run Architecture Tests
        run: dotnet test test/Bookify.ArchitectureTests/Bookify.ArchitectureTests.csproj --configuration Release --no-build

      - name: Run Application Integration Tests
        run: dotnet test test/Bookify.Application.IntegrationTests/Bookify.Application.IntegrationTests.csproj --configuration Release --no-build
