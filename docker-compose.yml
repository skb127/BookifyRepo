services:
  bookify.api:
    image: ${DOCKER_REGISTRY-}bookifyapi
    container_name: Bookify.Api
    build:
      context: .
      dockerfile: src/Bookify.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - cert-generator
      - bookify-db
      - bookify-redis
      - bookify-idp
      - bookify-seq
      - bookify-asb-emulator

  bookify-db:
    image: postgres:17
    container_name: Bookify.Db
    environment:
      - POSTGRES_DB=bookify
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/database:/var/lib/postgresql/data
    ports:
      - 5432:5432

  bookify-idp:
    image: quay.io/keycloak/keycloak:latest
    container_name: Bookify.Identity
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./.files/bookify-realm-export.json:/opt/keycloak/data/import/bookify-realm-export.json
    ports:
      - 18080:8080

  bookify-seq:
    image: datalust/seq:latest
    container_name: Bookify.Seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=Password123!
    volumes:
      - ./.containers/seq:/data
    ports:
      - 5341:5341
      - 8081:80

  bookify-redis:
    image: redis:latest
    container_name: Bookify.Redis
    volumes:
      - ./.containers/redis:/data
    ports:
      - 6379:6379

  cert-generator:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: Bookify.CertGen
    # Generate the certificate & grant the read permissions to everyone
    command: sh -c "dotnet dev-certs https -ep /https/aspnetapp.pfx -p Password123 && chmod 666 /https/aspnetapp.pfx"
    volumes:
      - ${HOME}/.aspnet/https:/https

  bookify-asb-sql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: Bookify.AsbSql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    networks:
      sb-emulator:
        aliases:
          - "mssql"

  bookify-asb-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: Bookify.AsbEmulator
    ports:
      - "5672:5672"
      - "5300:${EMULATOR_HTTP_PORT:-5300}"
    environment:
      - SQL_SERVER=bookify-asb-sql
      - MSSQL_SA_PASSWORD=Password123!
      - EMULATOR_HTTP_PORT=${EMULATOR_HTTP_PORT:-5300}
      - ACCEPT_EULA=Y
    volumes:
      - ./.files/azure-service-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      - bookify-asb-sql
    networks:
      default:
      sb-emulator:
        aliases:
          - "sb-emulator"

networks:
  sb-emulator:
